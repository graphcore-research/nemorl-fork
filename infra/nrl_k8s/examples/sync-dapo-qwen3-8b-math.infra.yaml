# Infra for examples/configs/sync-dapo-qwen3-8b-math.yaml on graphcore.
#
# The recipe is a colocated DTensor/FSDP GRPO run:
#   cluster.num_nodes=2, cluster.gpus_per_node=4
# so the RayCluster below creates 2 GPU workers, each requesting a
# 4-GPU node. Volt multinode nodes are gated by Kueue/reserved taints, so
# both head and worker pods carry those tolerations.

namespace: graphcore
image: erikaaranas/nemo-rl:latest
imagePullSecrets: []
# serviceAccount: <SERVICE_ACCOUNT_IF_REQUIRED>

labels:
  nrl-k8s/owner: ${user:}
  kueue.x-k8s.io/queue-name: unified

submit:
  submitter: portForward

launch:
  runMode: interactive
  codeSource: image
  codePath: /opt/nemo-rl
  entrypoint: |
    set -eu
    cd /opt/nemo-rl
    export PYTHONPATH=.
    export RAY_enable_infeasible_task_early_exit=true
    CONFIG=examples/configs/sync-dapo-qwen3-8b-math.yaml
    if [ ! -f "$CONFIG" ]; then
      echo "ERROR: $CONFIG is not present in the image." >&2
      echo "RayJob mode does not upload the local recipe; rebuild/push the image with this file, or use --raycluster upload mode." >&2
      exit 2
    fi
    python -u examples/run_grpo.py \
      --config "$CONFIG" \
      cluster.gpus_per_node=4 \
      cluster.num_nodes=2 \
      logger.wandb_enabled=true \
      logger.tensorboard_enabled=false

kuberay:
  training:
    name: ${user:}-sync-dapo-qwen3-8b-math
    labels:
      nrl-k8s/run: sync-dapo-qwen3-8b-math
    spec:
      rayVersion: "2.52.0"
      headGroupSpec:
        rayStartParams:
          dashboard-host: "0.0.0.0"
          num-gpus: "0"
        template:
          spec:
            tolerations:
            - key: nvidia.com/gpu
              value: "true"
              operator: Equal
              effect: NoSchedule
            - key: kueue.x-k8s.io/dedicated
              value: "true"
              operator: Equal
              effect: NoSchedule
            - key: reserved-for-multinode
              value: "true"
              operator: Equal
              effect: NoSchedule
            containers:
              - name: ray-head
                envFrom:
                  - secretRef:
                      name: ${user:}-secrets
                      optional: true
                env:
                  - {name: NCCL_DEBUG, value: WARN}
                  - {name: RAY_memory_monitor_refresh_ms, value: "0"}
                resources:
                  requests: {cpu: "8", memory: "32Gi"}
                  limits: {cpu: "16", memory: "64Gi"}
                ports:
                  - {containerPort: 6379, name: gcs-server}
                  - {containerPort: 8265, name: dashboard}
                  - {containerPort: 10001, name: client}
                volumeMounts:
                  - {mountPath: /dev/shm, name: dshm}
            volumes:
              - name: dshm
                emptyDir: {medium: Memory, sizeLimit: 16Gi}

      workerGroupSpecs:
        - groupName: gpu-workers
          replicas: 2
          minReplicas: 2
          maxReplicas: 2
          rayStartParams:
            num-gpus: "4"
          template:
            metadata:
              annotations:
                kueue.x-k8s.io/podset-slice-required-topology: nvidia.com/gpu.clique
                kueue.x-k8s.io/podset-slice-size: "2"
            spec:
              runtimeClassName: nvidia
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: nvidia.com/gpu.clique
                            operator: NotIn
                            values:
                              - a6ac8db7-d676-be13-eb99-486ebfb90a69.3
              tolerations:
              - key: nvidia.com/gpu
                value: "true"
                operator: Equal
                effect: NoSchedule
              - key: kueue.x-k8s.io/dedicated
                value: "true"
                operator: Equal
                effect: NoSchedule
              - key: reserved-for-multinode
                value: "true"
                operator: Equal
                effect: NoSchedule
              containers:
                - name: ray-worker
                  envFrom:
                    - secretRef:
                        name: ${user:}-secrets
                        optional: true
                  env:
                    - {name: NCCL_DEBUG, value: WARN}
                    - {name: RAY_memory_monitor_refresh_ms, value: "0"}
                  resources:
                    requests: {cpu: "32", memory: "256Gi", nvidia.com/gpu: "4", vpc.amazonaws.com/efa: "16"}
                    limits: {cpu: "32", memory: "256Gi", nvidia.com/gpu: "4", vpc.amazonaws.com/efa: "16"}
                  volumeMounts:
                    - {mountPath: /dev/shm, name: dshm}
              volumes:
                - name: dshm
                  emptyDir: {medium: Memory, sizeLimit: 128Gi}
