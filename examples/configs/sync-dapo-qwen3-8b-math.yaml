# Consolidated from examples/configs/grpo_math_1B.yaml and examples/configs/recipes/llm/dapo-qwen2.5-7b.v2.yaml.
# Uses DAPO Math/AIME with Qwen3-8B-Base on the dtensor/FSDP path.
# GRPO Algorithm Configuration
grpo:
  num_prompts_per_step: 256
  num_generations_per_prompt: 16
  max_rollout_turns: 1 # for multi-turn rollouts. Math Environments just have 1 turn (answering the question)
  max_num_epochs: 1
  max_num_steps: 2000
  normalize_rewards: true
  use_leave_one_out_baseline: false
  val_period: 100
  val_at_start: true
  val_at_end: true
  overlong_filtering: false
  advantage_clip_low: null
  advantage_clip_high: null
  max_val_samples: 960
  val_batch_size: 960
  seed: 42
  use_dynamic_sampling: true
  dynamic_sampling_max_gen_batches: 10
  batch_multiplier: 3 # Multiplier for dataloader batch size calculation (batch_multiplier × num_prompts_per_step). Following DAPO dynamic sampling, the actual training batch size equals num_prompts_per_step × num_generations_per_prompt.
  reward_shaping:
    enabled: true
    overlong_buffer_length: 2048
    overlong_buffer_penalty: 1
    max_response_length: 14336
    stop_properly_penalty_coef: null

  # Advantage Estimator Configuration
  # Options: "grpo" (default) or "reinforce_plus_plus"
  adv_estimator:
    name: "grpo"  # Use "reinforce_plus_plus" for Reinforce++ estimator
    normalize_rewards: ${grpo.normalize_rewards}
    use_leave_one_out_baseline: ${grpo.use_leave_one_out_baseline}
  reward_scaling:
    enabled: true
    source_min: 0.0
    source_max: 1.0
    target_min: 0.0
    target_max: 1.0
  seq_logprob_error_threshold: null
  # Advantage value assigned to invalid tool call tokens (e.g. -5.0 to penalize). null disables.
  invalid_tool_call_advantage: null
  # Advantage value assigned to tokens with malformed <think>/</think> tags (e.g. -5.0). null disables.
  malformed_thinking_advantage: null

  async_grpo:
    enabled: false # Set to true to enable async training mode
    # Max age (in training steps) for trajectories used in training
    max_trajectory_age_steps: 1
    in_flight_weight_updates: false # Set to true to enable in-flight weight updates
    recompute_kv_cache_after_weight_updates: false # Set to true to recompute kv cache after in-flight-weight-updates

loss_fn:
  reference_policy_kl_penalty: 0.0
  # Can be set to k1, k2, k3
  # For more details, see http://joschu.net/blog/kl-approx.html
  reference_policy_kl_type: "k3"
  kl_input_clamp_value: 20.0
  kl_output_clamp_value: 10.0
  ratio_clip_min: 0.2
  ratio_clip_max: 0.28
  ratio_clip_c: 10
  # (default off) loss formulation improvements (docs/guides/grpo.md#loss)
  use_on_policy_kl_approximation: false
  # Async GRPO requires importance sampling correction enabled
  # Set to true when async_grpo.enabled is true
  use_importance_sampling_correction: false
  # "tis"          – clamp IS weights to max
  # "icepop"       – zero out tokens with IS weight outside [min, max]
  # "seq-mask-tis" – zero out sequences by geometric-mean IS ratio, non-truncated token IS correction
  truncated_importance_sampling_type: null
  truncated_importance_sampling_ratio: null
  truncated_importance_sampling_ratio_min: null  # Lower bound for ICE-POP
  sequence_level_importance_ratios: false
  token_level_loss: true
  force_on_policy_ratio: false  # Set to true to force ratio=1.0 (requires train_global_batch_size == num_prompts_per_step * num_generations_per_prompt)
  use_kl_in_reward: false  # Reinforce++: add KL penalty to reward instead of loss
  use_cispo: false  # CISPO (https://arxiv.org/abs/2506.13585): clipped IS-weight policy optimization
  # Disable PPO ratio (curr_logprobs - prev_logprobs).exp(); falls back to REINFORCE-style
  # surrogate loss. Used by REINFORCE/RLOO. See https://arxiv.org/abs/2402.14740
  disable_ppo_ratio: false
  # VAPO positive-example NLL loss weight: L = L_PPO + mu * L_NLL(correct samples).
  # 0.0 disables it. VAPO paper recommends 0.1.
  positive_example_nll_weight: 0.0

checkpointing:
  enabled: true
  checkpoint_dir: results/dapo-qwen3-8B-math
  metric_name: "val:accuracy" # one of "val:" or "train:" followed by the metric name
  higher_is_better: true
  keep_top_k: 5
  save_period: 50
  checkpoint_must_save_by: null
  model_save_format: null
  save_consolidated: false
  save_optimizer: true

policy:
  model_name: Qwen/Qwen3-8B-Base
  tokenizer:
    name: ${policy.model_name} ## specify if you'd like to use a tokenizer different from the model's default
    chat_template_kwargs: null # can be used to pass kwargs to the chat template, e.g., enable_thinking=true
  hf_config_overrides: {}
  train_global_batch_size: 256
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 16384
  precision: "bfloat16"
  logprob_chunk_size: null
  offload_optimizer_for_logprob: false # Only useful for non-colocated generation since colocated generation will always offload optimizer to cuda before refit

  dtensor_cfg:
    _v2: true
    enabled: true
    cpu_offload: False
    sequence_parallel: false
    activation_checkpointing: true
    tensor_parallel_size: 1
    context_parallel_size: 4
    custom_parallel_plan: null

    # Automodel kwargs passed to from_pretrained.
    # Uncomment force_hf if the custom model's adapter doesn't support per-tensor
    # weight conversion (e.g. Qwen2, Llama). Auto-detected if not set.
    # See https://github.com/NVIDIA-NeMo/RL/issues/2072
    automodel_kwargs: {}
      # force_hf: true

    # LoRA (Low-Rank Adaptation) Configuration
  # See docs/design-docs/sequence-packing-and-dynamic-batching.md 
  # for more details on dynamic batching and sequence packing.
  dynamic_batching:
    enabled: False
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    sequence_length_round: 64

  sequence_packing:
    enabled: false
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    sequence_length_round: 64

  # makes the training sequence length divisible by the tensor parallel size
  # this is useful for sequence parallel training
  make_sequence_length_divisible_by: ${mul:${policy.dtensor_cfg.tensor_parallel_size},
    ${mul:2, ${policy.dtensor_cfg.context_parallel_size}}}
  max_grad_norm: 1.0

  optimizer:
    name: "torch.optim.AdamW"
    kwargs:
      lr: 1.0e-06
      weight_decay: 0.1
      betas: [0.9, 0.999]
      eps: 1e-8

  scheduler:
    - name: "torch.optim.lr_scheduler.LinearLR"
      kwargs:
        start_factor: 1.0e-08
        end_factor: 1.0
        total_iters: 10
    - name: "torch.optim.lr_scheduler.ConstantLR"
      kwargs:
        factor: 1.0
        total_iters: 10000000000
    - milestones:
      - 10

  generation:
    # Port range for vLLM HTTP servers, kept below the OS ephemeral range.
    # See ray.sub for the full port layout.
    port_range_low: 11001
    port_range_high: 15000
    backend: "vllm"
    max_new_tokens: 16384
    temperature: 1.0
    top_p: 1.0
    top_k: null
    stop_token_ids: null
    stop_strings: null
    vllm_cfg:
      async_engine: false
      precision: ${policy.precision}
      kv_cache_dtype: "auto"
      tensor_parallel_size: 2
      pipeline_parallel_size: 1
      expert_parallel_size: 1  # When EP > 1, EP must be a multiple of TP since vLLM's EP = DP * TP
      gpu_memory_utilization: 0.7
      max_model_len: ${policy.max_total_sequence_length}
      # when enforce_eager is False, it is optional to set ++policy.generation.vllm_kwargs.compilation_config.backend=eager for better accuracy,
      # with the flag, vllm will use the custom CUDA kernels instead of the Triton kernels generated by torch.compile
      # for more details, see convergence issue https://github.com/NVIDIA-NeMo/RL/issues/998
      enforce_eager: true
      use_tqdm: true # Set to false to suppress vLLM generation progress bars. Only applies when async_engine is false
      use_deep_gemm: False
      num_last_layers_in_bf16: 0
      num_first_layers_in_bf16: 0
      enable_vllm_metrics_logger: true # Set to true to enable vLLM internal metrics logger, turn off for better performance
      vllm_metrics_logger_interval: 0.5 # Interval in seconds to collect vLLM logger metrics
    vllm_kwargs: {}
    colocated:
      # true: generation shares training GPUs
      # false: uses dedicated generation resources
      enabled: true
      # only relevant when enabled is false
      resources:
        gpus_per_node: null # Decides num gpus to be dedicated to generation when there is one node in the cluster i.e cluster.num_nodes == 1
        num_nodes: null # Decides number of nodes to be dedicated to generation

data:
  max_input_seq_length: 2048
  shuffle: true
  num_workers: 1

  # use multiple dataloader for train
  # see https://github.com/NVIDIA-NeMo/RL/blob/main/docs/guides/grpo.md#multiple-dataloaders for more details.
  use_multiple_dataloader: false

  # dataset
  train:
    dataset_name: DAPOMath17K
  validation:
    dataset_name: DAPOMathAIME2024
  # default settings for all datasets
  default:
    prompt_file: null
    system_prompt_file: null
    processor: "math_hf_data_processor"
    env_name: "math"

  # You can also use multiple datasets by using a list of datasets.
  # See `examples/configs/grpo_multiple_datasets.yaml` for a full configuration example.

  # You can use custom response datasets for training and validation. For example:
  # train:
  #   # this dataset will override input_key and use the default values for other vars
  #   data_path: /path/to/local/train_dataset.jsonl
  #   input_key: question
  # validation:
  #   # this dataset will use the default values for other vars except data_path
  #   data_path: /path/to/local/val_dataset.jsonl
  # default:
  #   # will use below vars as default values if dataset doesn't specify it
  #   dataset_name: ResponseDataset
  #   input_key: input
  #   output_key: output
  #   prompt_file: null
  #   system_prompt_file: null
  #   processor: "math_hf_data_processor"
  #   env_name: math
  # See https://github.com/NVIDIA-NeMo/RL/blob/main/docs/guides/grpo.md#datasets for more details.

env:
  math:
    num_workers: 16
    math_verify_impl: dapo_math_verify

logger:
  log_dir: "logs"  # Base directory for all logs
  num_val_samples_to_print: 0 # Number of validation samples to pretty print on terminal
  wandb_enabled: true
  tensorboard_enabled: false
  mlflow_enabled: false  # Disable MLflow logging
  swanlab_enabled: false # Disable SwanLab logging
  monitor_gpus: false
  wandb:
    project: post-training-frameworks
    name: nemo-dapo-qwen3-8b-math
  gpu_monitoring:
    collection_interval: 10  # How often to collect GPU usage metrics (in seconds)
    flush_interval: 10  # How often to flush GPU usage metrics to the loggers (in seconds)

cluster:
  # Volt NVL72 workers expose 4 GPUs per node. Keep this in sync with the
  # Ray worker resources in infra/nrl_k8s/examples/sync-dapo-qwen3-8b-math.infra.yaml.
  gpus_per_node: 4
  num_nodes: 2
  # Port range for the distributed master address (TCPStore / NCCL rendezvous)
  # and per-worker available ports.  Kept below the OS ephemeral range
  # (32768-60999 on stock Linux).  See ray.sub for the full port layout.
  master_port_range_low: 25000
  master_port_range_high: 28000

# TransferQueue-mediated data plane for sync GRPO.
# Off by default — the legacy grpo_train trainer never engages this.
# Flip enabled=true and run grpo_train_sync to use TQ-mediated bulk
# transfer between rollout and train. See nemo_rl/data_plane/README.md.
data_plane:
  enabled: false
  impl: transfer_queue
  backend: "simple"                  # TQ storage backend ('simple' or 'mooncake_cpu')
  storage_capacity: 1000000          # max samples retained per partition
  num_storage_units: 2               # storage shards
  claim_meta_poll_interval_s: 0.5    # blocking-claim poll cadence
  global_segment_size: 549755813888  # 512 GiB — used when backend == "mooncake_cpu"
  local_buffer_size:   68719476736   # 64 GiB  — used when backend == "mooncake_cpu"
  # observability:                    # NotRequired
  #   enabled: false
